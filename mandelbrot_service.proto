syntax = "proto3"; 

package mandelbrot; 

service MandelbrotService { 
    rpc WaitForSignal(SignalRequest) returns (stream SignalResponse); 
    rpc SendSignal(SignalRequest) returns (SignalResponse); 
    rpc ApplyForBlock(BlockApplyRequest) returns (BlockApplyResponse); 
    rpc SendBlockData(SomeRequest) returns (SignalResponse); 
    rpc RequestBlockData(BlockDataRequest) returns (SomeRequest); 
    rpc NotifyTrainingComplete(TrainingCompleteNotify) returns (SignalResponse); 
    rpc SyncStep(SyncRequest) returns (SyncResponse); 
    
    // Added: Methods for synchronizing layer parameters
    rpc SyncLayerParameters(LayerParameterSyncRequest) returns (LayerParameterSyncResponse);
    rpc GetSyncParameters(SyncParameterRequest) returns (SyncParameterResponse);
    rpc RegisterAndGetUniqueId(UniqueIdRequest) returns (UniqueIdResponse);
    rpc ReportOomAndWait(OomReportRequest) returns (OomReportResponse);
    rpc ClearGradientCache(ClearGradientCacheRequest) returns (ClearGradientCacheResponse);
} 

message UniqueIdRequest {
    string worker_id = 1;    // Unique client identifier (Worker ID)
    int32 local_rank = 2;           // Client's local rank (optional; helps the server record the topology)
    int64 timestamp = 3;            // Timestamp when the request was initiated
}

message UniqueIdResponse {
    // Whether the request succeeded (for example, the node registered or is waiting for other nodes)
    bool success = 1;

    // Response message containing detailed status or error information for the client
    string message = 2;

    // Added: Master node IP address for establishing TCP connections or initializing the distributed environment
    string master_addr = 3;

    // Added: Master node communication port
    int32 master_port = 4;

    // Global rank confirmed and assigned to the client by the server (prevents conflicts from client-side calculation)
    int32 client_global_rank = 5;

    // Server's global rank
    int32 server_global_rank = 6;

    // Server's unique Worker ID for client-side logging and debugging
    string server_worker_id = 7;

    // Expected world size, used by the server to verify that all cluster nodes have joined
    int32 world_size = 8;

    // Response timestamp (Unix milliseconds), used for network latency evaluation and timeout control
    int64 timestamp = 9;
}

message SignalRequest { 
    string worker_id = 1; 
    string signal_name = 2; 
    string message = 3; 
    int64 timestamp = 4; 
} 

message SignalResponse { 
    bool success = 1; 
    string message = 2; 
    int64 timestamp = 3; 
} 

message BlockApplyRequest { 
    string worker_id = 1; 
    int32 block_idx = 2; 
    int64 step = 3; 
} 

message BlockApplyResponse { 
    bool approved = 1; 
    string message = 2; 
    int32 assigned_block_idx = 3; 
} 

message BlockDataRequest { 
    string worker_id = 1; 
    int32 block_idx = 2; 
    bool is_grad_enabled = 3;
    int64 step = 4; 
} 

message TrainingCompleteNotify { 
    string worker_id = 1; 
    int32 block_idx = 2; 
    int64 step = 3; 
    float loss = 4; 
    string message = 5; 
} 

message SomeRequest { 
    // Core input tensors
    bytes hidden_states = 1; 
    repeated int64 hidden_states_shape = 2; 
    string hidden_states_dtype = 3;     // Added: Data type (for example, "float16" or "bfloat16")
    string server_worker_id = 4;        // Server-side Worker ID
    
    bytes attention_mask = 5; 
    repeated int64 attention_mask_shape = 6; 
     
    bytes position_ids = 7; 
    repeated int64 position_ids_shape = 8; 
     
    // KV cache
    repeated bytes past_keys = 9; 
    repeated bytes past_values = 10; 
    repeated int64 kv_shapes = 11; 
     
    // Control flags
    bool output_attentions = 12; 
    bool use_cache = 13; 
     
    // Other parameters
    repeated int32 mor_layer_ids = 14; 
     
    // Extension fields (16+)
    repeated StringBytesEntry out_middle_proj = 16; 
    repeated Int64ListEntry out_middle_proj_shapes = 17; 
    repeated StringBytesEntry kwargs = 18; 
     
    // Routing and metadata
    int32 block_idx = 19; 
    string worker_id = 20; 
    int64 step = 21; 
    bool use_triple = 22;
} 

message StringBytesEntry { 
    string key = 1; 
    bytes value = 2; 
} 

message Int64ListEntry { 
    string key = 1; 
    repeated int64 value = 2; 
} 

message SyncRequest { 
    string worker_id = 1; 
    int64 client_step = 2; 
    float client_loss = 3; 
    bool is_server = 4; 
} 

message SyncResponse { 
    bool success = 1; 
    int64 global_step = 2; 
    float adjusted_lr = 3; 
    bool should_stop = 4; 
    string message = 5; 
} 

// ============================================================
// Added: Message definitions for layer parameter synchronization
// ============================================================

// Layer parameter synchronization request (synchronizes layer_idx, worker_id, and bMax_frequency)
message LayerParameterSyncRequest {
    string worker_id = 1;             // Client ID
    int32 batch_size = 2;        // Starting block index for distributed training
    int32 layer_idx = 3;              // Layer index (layer_idx)
    bool b_max_frequency = 4;         // Value of the bMax_frequency parameter
    int64 step = 5;                   // Current training step
    int64 timestamp = 6;              // Timestamp
    bytes additional_data = 7;        // Additional data (if needed)
    bool use_gradient_checkpointing = 8;         // Gradient checkpointing mode
    repeated int64 tensor_shape = 9; 
    string tensor_dtype = 10;  
    bool use_nccl = 11;
}

// Layer parameter synchronization response
message LayerParameterSyncResponse {
    bool success = 1;                 // Whether synchronization succeeded
    string message = 2;               // Response message
    string worker_id = 3;             // Client ID
    int64 timestamp = 4;              // Timestamp
    bool use_nccl = 5;
    bool use_gradient_checkpointing =6;
    bool use_triple = 7;
    float mem_threshold=8;
    float vram_threshold=9;
    int32 save_epochs=10;
    int32 save_steps=11;
}

// Synchronization parameter request
message SyncParameterRequest {
    string worker_id = 1;             // Client ID
    int32 requested_layer_idx = 2;    // Requested layer index (optional)
    int64 timestamp = 3;              // Timestamp
}

// Synchronization parameter response
message SyncParameterResponse {
    bool success = 1;                 // Whether the request succeeded
    string message = 2;               // Response message
    repeated SyncedParameterEntry parameters = 3; // List of synchronized parameters
    int64 timestamp = 4;              // Timestamp
}

// Synchronized parameter entry
message SyncedParameterEntry {
    string worker_id = 1;             // Worker node ID
    int32 layer_idx = 2;              // Layer index (layer_idx)
    bool b_max_frequency = 3;         // Value of bMax_frequency
    int64 last_updated_step = 4;      // Last update step
    int64 timestamp = 5;              // Timestamp
    bool is_active = 6;               // Whether the worker is active
}

// ============================================================
// Added: Message definitions for VRAM OOM reporting and wait-time negotiation
// ============================================================

// VRAM OOM report request
message OomReportRequest {
    string worker_id = 1;             // ID of the client that encountered the OOM
    int32 block_idx = 2;              // Block index where the OOM occurred
    int64 step = 3;                   // Current training step
    int64 timestamp = 4;              // Timestamp when the request was initiated

    // VRAM status information
    float current_vram_usage_gb = 5;  // Current VRAM usage (GB)
    float total_vram_gb = 6;          // Total VRAM capacity (GB)
    float requested_vram_gb = 7;      // Amount of VRAM requested when the OOM was triggered (GB)

    // Error and context information
    string error_message = 8;         // Detailed OOM error message (for example, CUDA out of memory)
    string layer_name = 9;            // Name or identifier of the layer where the OOM occurred (optional)

    // Wait time requested by the client (milliseconds)
    int64 requested_wait_time_ms = 10;
}

// VRAM OOM report response
message OomReportResponse {
    bool success = 1;                 // Whether the server successfully received and processed the report
    string message = 2;               // Response message or global scheduling instruction

    // Wait time assigned by the server (milliseconds)
    // The client should pause training or retries, then resume after this interval
    int64 assigned_wait_time_ms = 3;

    // Recovery strategy recommended by the server
    OomRecoveryStrategy recovery_strategy = 4;

    // Response timestamp
    int64 timestamp = 5;
}

// Recovery strategy enumeration
enum OomRecoveryStrategy {
    STRATEGY_UNKNOWN = 0;             // Unknown/default
    STRATEGY_RETRY = 1;               // Retry the current step after waiting
    STRATEGY_REDUCE_BATCH = 2;        // Reduce the batch size and retry
    STRATEGY_GRADIENT_CHECKPOINT = 3; // Enable or increase gradient checkpointing to save VRAM
    STRATEGY_ABORT = 4;               // Abandon the current step or terminate training
}


// ============================================================
// Added: Message definitions for clearing the gradient checkpoint cache when MoR produces no loss
// ============================================================

// Gradient checkpoint cache clear request
message ClearGradientCacheRequest {
    string worker_id = 1;             // ID of the client or intermediate server initiating the request
    int32 block_idx = 2;              // Block index where no loss was produced (Block Index)
    int64 step = 3;                   // Current training step (Global Step)
    int64 timestamp = 4;              // Timestamp when the request was initiated (milliseconds)

    // Cache identifier and context
    string layer_name = 5;            // Layer name or MoR identifier that triggered the clear operation (optional)
    string reason = 6;                // Reason for clearing (for example, "mor_no_loss" or "skip_gradient_checkpoint")
}

// Gradient checkpoint cache clear response
message ClearGradientCacheResponse {
    bool success = 1;                 // Whether the server successfully processed the clear request
    string message = 2;               // Response message or detailed status
    int32 cleared_count = 3;          // Number of cache entries actually cleared (for debugging and monitoring)
    int64 timestamp = 4;              // Timestamp when server-side processing completed
}
